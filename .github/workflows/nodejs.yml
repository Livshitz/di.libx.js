# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        if: "!contains(github.event.head_commit.message, 'skip-ci')"

        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v2
            # Setup .npmrc file to publish to npm
            - uses: actions/setup-node@v1
              with:
                  node-version: ${{ matrix.node-version }}
                  registry-url: 'https://registry.npmjs.org'
                  scope: '@octocat' # Defaults to the user or organization that owns the workflow file:
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            # Install from the COMMITTED bun.lock. `yarn --frozen-lockfile` was a no-op here (no yarn.lock ->
            # "info No lockfile found."), so every CI run re-resolved every ^ range to latest and the build was
            # not reproducible. Scripts still run under yarn; only the install step changed.
            - run: bun install --frozen-lockfile
            - name: Build
              run: |
                  yarn build
            - name: Build-browser
              if: github.ref == 'refs/heads/master'
              run: |
                  yarn build-browser
            - run: yarn test
            - name: Fetch npm token from secrets broker
              if: github.ref == 'refs/heads/master'
              env:
                TOKEN_URL: ${{ secrets.NPM_TOKEN_URL }}
                APP_SECRET: ${{ secrets.NPM_BROKER_SECRET }}
              run: |
                TOKEN=$(curl -fsS -H "x-app-secret: $APP_SECRET" "$TOKEN_URL" \
                  | jq -r '.value')
                [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::could not fetch NPM_TOKEN from secrets broker"; exit 1; }
                echo "::add-mask::$TOKEN"
                echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
                # yarn publish does not consume NODE_AUTH_TOKEN the way `npm publish` does — write the
                # literal auth line into the npmrc that setup-node created (it points NPM_CONFIG_USERCONFIG there).
                NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
                echo "//registry.npmjs.org/:_authToken=$TOKEN" >> "$NPMRC"
            - name: Bump & Publish
              if: github.ref == 'refs/heads/master'
              run: |
                  git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
                  git config user.name "$GITHUB_ACTOR"
                  yarn bump
              env:
                  NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
